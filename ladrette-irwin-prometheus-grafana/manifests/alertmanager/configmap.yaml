apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: [alertname, severity]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      receiver: "null"
      routes:
        - matchers:
            - severity = critical
          receiver: "null"

    receivers:
      - name: "null"

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: [alertname]
