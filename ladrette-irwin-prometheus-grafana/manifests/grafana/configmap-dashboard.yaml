apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: monitoring
data:
  app-monitoring.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {"type": "grafana", "uid": "-- Grafana --"},
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Panel A — Erreurs 5xx (5 dernières minutes)",
          "description": "Nombre total d'erreurs HTTP 5xx sur les 5 dernières minutes.",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(increase(http_requests_total{status=~\"5..\"}[5m]))",
              "legendFormat": "Erreurs 5xx",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 5}
                ]
              },
              "unit": "short",
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "bargauge",
          "title": "Panel B — Erreurs 4xx et 5xx (5 dernières minutes)",
          "description": "Nombre d'erreurs HTTP par famille (4xx et 5xx) sur les 5 dernières minutes.",
          "gridPos": {"x": 6, "y": 0, "w": 9, "h": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(increase(http_requests_total{status=~\"4..\"}[5m]))",
              "legendFormat": "Erreurs 4xx",
              "refId": "A",
              "instant": true
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(increase(http_requests_total{status=~\"5..\"}[5m]))",
              "legendFormat": "Erreurs 5xx",
              "refId": "B",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "short",
              "noValue": "0",
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 80}]}
            },
            "overrides": [
              {"matcher": {"id": "byName", "options": "Erreurs 4xx"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]},
              {"matcher": {"id": "byName", "options": "Erreurs 5xx"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]}
            ]
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Taux d'erreur global",
          "gridPos": {"x": 15, "y": 0, "w": 9, "h": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(http_requests_total{status=~\"[45]..\"}[5m])) / sum(rate(http_requests_total[5m]))",
              "legendFormat": "Taux d'erreur",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.1}, {"color": "red", "value": 0.3}]
              },
              "unit": "percentunit",
              "noValue": "0%"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Panel C — Trafic HTTP par famille de codes (évolution)",
          "description": "Évolution du trafic HTTP par famille de codes de réponse en req/s.",
          "gridPos": {"x": 0, "y": 5, "w": 24, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(http_requests_total{status=~\"2..\"}[1m]))",
              "legendFormat": "2xx",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(http_requests_total{status=~\"4..\"}[1m]))",
              "legendFormat": "4xx",
              "refId": "B"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(http_requests_total{status=~\"5..\"}[1m]))",
              "legendFormat": "5xx",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 2, "fillOpacity": 10, "gradientMode": "none", "showPoints": "never"},
              "unit": "reqps"
            },
            "overrides": [
              {"matcher": {"id": "byName", "options": "2xx"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]},
              {"matcher": {"id": "byName", "options": "4xx"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]},
              {"matcher": {"id": "byName", "options": "5xx"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]}
            ]
          },
          "options": {
            "tooltip": {"mode": "multi", "sort": "none"},
            "legend": {"displayMode": "list", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"]}
          }
        },
        {
          "id": 5,
          "type": "piechart",
          "title": "Panel D — Répartition des réponses HTTP (5 dernières minutes)",
          "description": "Proportion des réponses 2xx, 4xx et 5xx sur les 5 dernières minutes.",
          "gridPos": {"x": 0, "y": 13, "w": 10, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(increase(http_requests_total{status=~\"2..\"}[5m]))",
              "legendFormat": "2xx — Succès",
              "refId": "A",
              "instant": true
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(increase(http_requests_total{status=~\"4..\"}[5m]))",
              "legendFormat": "4xx — Erreurs client",
              "refId": "B",
              "instant": true
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(increase(http_requests_total{status=~\"5..\"}[5m]))",
              "legendFormat": "5xx — Erreurs serveur",
              "refId": "C",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "unit": "short"},
            "overrides": [
              {"matcher": {"id": "byName", "options": "2xx — Succès"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]},
              {"matcher": {"id": "byName", "options": "4xx — Erreurs client"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]},
              {"matcher": {"id": "byName", "options": "5xx — Erreurs serveur"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]}
            ]
          },
          "options": {
            "pieType": "pie",
            "displayLabels": ["percent", "name"],
            "legend": {"displayMode": "table", "placement": "right", "calcs": ["sum"]},
            "tooltip": {"mode": "single", "sort": "none"}
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Panel E — Items traités par l'application (req/s)",
          "description": "Débit de traitement métier : items traités par seconde et erreurs de traitement.",
          "gridPos": {"x": 10, "y": 13, "w": 14, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "rate(app_items_processed_total[1m])",
              "legendFormat": "Items traités/s",
              "refId": "A"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "rate(app_processing_errors_total[1m])",
              "legendFormat": "Erreurs de traitement/s",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"lineWidth": 2, "fillOpacity": 15, "gradientMode": "none", "showPoints": "never"},
              "unit": "short"
            },
            "overrides": [
              {"matcher": {"id": "byName", "options": "Items traités/s"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "blue"}}]},
              {"matcher": {"id": "byName", "options": "Erreurs de traitement/s"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]}
            ]
          },
          "options": {
            "tooltip": {"mode": "multi", "sort": "none"},
            "legend": {"displayMode": "list", "placement": "bottom", "calcs": ["mean", "max", "lastNotNull"]}
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["http", "prometheus", "monitoring"],
      "templating": {"list": []},
      "time": {"from": "now-30m", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Application HTTP — Monitoring",
      "uid": "http-app-monitoring",
      "version": 1,
      "weekStart": ""
    }
