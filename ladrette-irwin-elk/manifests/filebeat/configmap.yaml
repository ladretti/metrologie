apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: logging
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"

    processors:
      - drop_event:
          when:
            not:
              equals:
                kubernetes.labels.app: "app"

    output.logstash:
      hosts: ["logstash.logging.svc.cluster.local:5044"]

    logging.level: warning
    logging.to_files: false
